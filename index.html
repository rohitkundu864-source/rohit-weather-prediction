<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohit Weather Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rohit Weather Prediction</h1>
        <p class="subtitle">Enter your city and get today's weather instantly</p>
        <div class="input-group">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London)">
            <button onclick="getWeather()">Get Weather</button>
        </div>
        <div id="weatherResult" class="result-box"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
